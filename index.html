<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>初一年级足球·篮球联赛</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1 id="appTitle">初一年级足球·篮球联赛</h1>
    <span class="sync" id="syncState">加载中…</span>
  </div>
</header>

<main id="app"></main>

<nav class="tabbar">
  <button class="tab active" data-view="schedule"><span>📅</span>赛程</button>
  <button class="tab" data-view="standings"><span>🏆</span>积分榜</button>
  <button class="tab" data-view="attendance"><span>✅</span>考勤</button>
  <button class="tab" data-view="admin"><span>⚙️</span>录入</button>
</nav>

<!-- 比赛详情 / 录入弹层 -->
<div class="sheet-mask" id="sheetMask" hidden></div>
<div class="sheet" id="sheet" hidden></div>

<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
